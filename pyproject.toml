[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigil"
version = "0.1.0"
description = "PII detection tool"
requires-python = ">=3.12"
dependencies = [
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]

[project.scripts]
vigil = "vigil.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
